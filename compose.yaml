services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kapibala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an ignored .env file}
      POSTGRES_DB: kapibala
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kapibala -d kapibala']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: kapibala-backend:${CANDIDATE_SHA:-local}
    build: ./backend
    command: [/app/migrate]
    environment:
      DATABASE_URL: postgres://kapibala:${POSTGRES_PASSWORD}@postgres:5432/kapibala?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  gateway-db:
    image: postgres:16
    environment:
      PGHOST: postgres
      PGUSER: kapibala
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        psql -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE DATABASE kapibala_telegram_gateway OWNER kapibala'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'kapibala_telegram_gateway');
        \gexec
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  gateway:
    image: kapibala-gateway:${CANDIDATE_SHA:-local}
    build: ./gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kapibala:${POSTGRES_PASSWORD}@postgres:5432/kapibala_telegram_gateway?sslmode=disable
      BIND_HOST: 0.0.0.0
      PORT: 8081
      GATEWAY_MODE: telegram
    depends_on:
      gateway-db:
        condition: service_completed_successfully

  agent:
    image: kapibala-backend:${CANDIDATE_SHA:-local}
    build: ./backend
    command: [/app/agent]
    environment:
      DATABASE_URL: postgres://kapibala:${POSTGRES_PASSWORD}@postgres:5432/kapibala?sslmode=disable
      BIND_HOST: 0.0.0.0
      PORT: 8082
      AGENT_MODE: ${AGENT_MODE:-scripted}
      AGENT_ADMIN_ENABLED: 'false'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-flash}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_API_STYLE: ${OPENAI_API_STYLE:-chat_completions}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    image: kapibala-backend:${CANDIDATE_SHA:-local}
    build: ./backend
    environment:
      DATABASE_URL: postgres://kapibala:${POSTGRES_PASSWORD}@postgres:5432/kapibala?sslmode=disable
      GATEWAY_URL: http://gateway:8081
      AGENT_URL: http://agent:8082
      BIND_HOST: 0.0.0.0
      PORT: 8080
      MEDIA_DIR: /app/media
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
    volumes:
      - media-data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
      agent:
        condition: service_started

  frontend:
    image: kapibala-frontend:${CANDIDATE_SHA:-local}
    build:
      context: .
      dockerfile: scripts/frontend.Dockerfile
    ports:
      - '127.0.0.1:${CONSOLE_PORT:-5173}:80'
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  media-data:
