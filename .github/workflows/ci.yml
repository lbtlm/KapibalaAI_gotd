name: CI
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch and commit policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: node --test scripts/*.test.mjs
      - run: node scripts/ci-policy.mjs

  go:
    name: Go / PostgreSQL / race / vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kapibala
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kapibala_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kapibala -d kapibala_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://kapibala:ci-only@127.0.0.1:5432/kapibala_test?sslmode=disable
      GATEWAY_TEST_DATABASE_URL: postgres://kapibala:ci-only@127.0.0.1:5432/kapibala_test?sslmode=disable
      GATEWAY_INTEGRATION_URL: http://127.0.0.1:18081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            backend/go.sum
            gateway/go.sum
      - name: Start actual fake gateway on an isolated integration database
        working-directory: gateway
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          DATABASE_URL: postgres://kapibala:ci-only@127.0.0.1:5432/kapibala_gateway_integration?sslmode=disable
          GATEWAY_MODE: fake
          GATEWAY_ADMIN_ENABLED: 'false'
          BIND_HOST: 127.0.0.1
          PORT: 18081
        run: |
          docker exec "$PG_CONTAINER" createdb -U kapibala kapibala_gateway_integration
          go build -o "$RUNNER_TEMP/gateway-integration" ./cmd/gateway
          "$RUNNER_TEMP/gateway-integration" > "$RUNNER_TEMP/gateway-integration.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/gateway-integration.pid"
          curl --fail --retry 60 --retry-delay 1 --retry-connrefused "$GATEWAY_INTEGRATION_URL/health" | jq --exit-status '.mode == "fake" and .status == "ok"'
      - run: node scripts/go-test.mjs backend
      - run: node scripts/go-test.mjs gateway
      - run: node scripts/go-test.mjs backend -race
      - run: node scripts/go-test.mjs gateway -race
      - run: go vet ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: gateway
      - name: Stop only this job's integration gateway
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/gateway-integration.pid"; then
            kill "$(cat "$RUNNER_TEMP/gateway-integration.pid")" || true
          fi
      - name: Gateway integration failure diagnostics
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/gateway-integration.log"; then
            tail -n 100 "$RUNNER_TEMP/gateway-integration.log"
          fi

  frontend:
    name: Frontend unit / types / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  e2e:
    name: Real stack Playwright C3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kapibala
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kapibala_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kapibala -d kapibala_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://kapibala:ci-only@127.0.0.1:5432/kapibala_e2e?sslmode=disable
      E2E_STACK_COMMAND: node scripts/fake-stack.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: |
            backend/go.sum
            gateway/go.sum
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  artifact:
    name: Immutable candidate images
    needs: [policy, go, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: kapibala-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: ci-only
      CONSOLE_PORT: '15173'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Build images for the tested commit
        run: |
          docker compose build
      - name: Run the same candidate images and verify container HTTP contracts
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml up -d --no-build
          node scripts/compose-smoke.mjs http://127.0.0.1:15173 http://127.0.0.1:18081 http://127.0.0.1:18082
      - name: Candidate container failure diagnostics
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --tail 100
      - name: Clean only this disposable CI project
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down --volumes --remove-orphans
      - name: Package the verified original images
        run: |
          mkdir -p candidate
          docker save "kapibala-backend:$CANDIDATE_SHA" "kapibala-gateway:$CANDIDATE_SHA" "kapibala-frontend:$CANDIDATE_SHA" | gzip > candidate/images.tar.gz
          cp compose.yaml candidate/compose.yaml
          printf '%s\n' "$CANDIDATE_SHA" > candidate/COMMIT_SHA
          cd candidate
          sha256sum images.tar.gz compose.yaml COMMIT_SHA > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI Gate
    if: always()
    needs: [policy, go, frontend, e2e, artifact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: node scripts/ci-policy.mjs gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
